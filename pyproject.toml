[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-monitor"
version = "1.0.0"
description = "Beobachtet govdata.de, Bundesgesetze und EU-Parlamentsabstimmungen und speichert Änderungen in SQLite"
license = { text = "MIT" }
authors = [{ name = "Tim" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
open-data-monitor = "open_data_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
