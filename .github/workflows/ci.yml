name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Abhängigkeiten installieren
        run: |
          pip install -e '.[dev]'
          pip install "ruff==0.17.6"
      - name: Ruff (Syntaxfehler, ungenutzte Importe, unbekannte Namen)
        run: ruff check --select E9,F .
      - name: Tests
        run: python -m pytest -q
